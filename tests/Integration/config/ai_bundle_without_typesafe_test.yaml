framework:
    test: true
    secret: 'test'
    http_client: ~

services:
    app.platform:
        alias: Lingoda\AiSdk\PlatformInterface
        public: true
    app.trace_exporter:
        alias: Lingoda\LangfuseBundle\Client\OtlpTraceExporter
        public: true

lingoda_ai:
    providers:
        openai:
            api_key: 'test-openai-key'
            organization: ''
    logging:
        enabled: false
    rate_limiting:
        enabled: false

lingoda_langfuse:
    connection:
        public_key: 'pk-test'
        secret_key: 'sk-test'
    tracing:
        export_timeout: 7
